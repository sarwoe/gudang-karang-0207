<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gudang Karang 0207</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f3f4f6;
    color:#111827
}

button,input{
    font:inherit
}

.login{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#166534;
    padding:20px
}

.login-box{
    background:white;
    width:100%;
    max-width:390px;
    padding:30px;
    border-radius:16px;
    box-shadow:0 10px 30px rgba(0,0,0,.2)
}

.login-icon{
    text-align:center;
    font-size:45px
}

.login-box h1{
    text-align:center;
    font-size:23px;
    margin:10px 0 5px
}

.login-box p{
    text-align:center;
    color:#6b7280;
    margin-bottom:25px
}

.form-group{
    margin-bottom:15px
}

label{
    display:block;
    font-weight:bold;
    font-size:14px;
    margin-bottom:6px
}

input{
    width:100%;
    padding:12px;
    border:1px solid #d1d5db;
    border-radius:8px
}

.btn{
    border:0;
    border-radius:8px;
    padding:11px 15px;
    cursor:pointer;
    font-weight:bold
}

.btn-green{
    background:#166534;
    color:white
}

.btn-red{
    background:#dc2626;
    color:white
}

.login-btn{
    width:100%
}

.login-error{
    display:none;
    background:#fee2e2;
    color:#991b1b;
    padding:10px;
    border-radius:8px;
    margin-bottom:15px;
    font-size:13px
}

.app{
    display:none
}

header{
    background:#166534;
    color:white;
    padding:16px
}

.header{
    max-width:1100px;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px
}

.header h1{
    margin:0;
    font-size:21px
}

.header p{
    margin:4px 0 0;
    font-size:12px;
    opacity:.85
}

.user{
    text-align:right;
    font-size:12px
}

.container{
    max-width:1100px;
    margin:auto;
    padding:20px
}

nav{
    display:flex;
    gap:8px;
    overflow-x:auto;
    margin-bottom:20px
}

nav button{
    border:0;
    background:white;
    padding:11px 15px;
    border-radius:8px;
    font-weight:bold;
    white-space:nowrap;
    cursor:pointer
}

nav button.active{
    background:#166534;
    color:white
}

.page{
    display:none
}

.page.active{
    display:block
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:15px;
    margin-bottom:20px
}

.card{
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 2px 8px rgba(0,0,0,.06)
}

.card-title{
    color:#6b7280;
    font-size:14px
}

.card-number{
    color:#166534;
    font-size:30px;
    font-weight:bold;
    margin-top:8px
}

.box{
    background:white;
    padding:18px;
    border-radius:12px;
    margin-bottom:20px;
    box-shadow:0 2px 8px rgba(0,0,0,.05)
}

.box h2{
    margin:0 0 15px;
    font-size:18px
}

.search{
    margin-bottom:15px
}

.table-wrap{
    overflow-x:auto
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:600px
}

th,td{
    padding:12px 9px;
    border-bottom:1px solid #e5e7eb;
    text-align:left;
    font-size:14px
}

th{
    background:#f9fafb
}

.badge{
    display:inline-block;
    padding:5px 9px;
    border-radius:20px;
    font-size:12px;
    font-weight:bold
}

.green{
    background:#dcfce7;
    color:#166534
}

.orange{
    background:#ffedd5;
    color:#9a3412
}

.red{
    background:#fee2e2;
    color:#991b1b
}

.empty{
    text-align:center;
    padding:30px;
    color:#6b7280
}

.error{
    background:#fee2e2;
    color:#991b1b;
    padding:12px;
    border-radius:8px;
    margin-bottom:15px;
    display:none
}

@media(max-width:600px){
    .container{
        padding:12px
    }

    .header{
        align-items:flex-start
    }

    .user{
        font-size:10px
    }

    .user button{
        font-size:11px;
        padding:7px 9px
    }
}
</style>
</head>

<body>

<!-- LOGIN -->

<div id="loginPage" class="login">

<div class="login-box">

<div class="login-icon">📦</div>

<h1>Gudang Karang 0207</h1>

<p>Login Admin Gudang</p>

<div id="loginError" class="login-error"></div>

<form onsubmit="login(event)">

<div class="form-group">

<label>Email</label>

<input
id="email"
type="email"
placeholder="Email admin"
required>

</div>

<div class="form-group">

<label>Password</label>

<input
id="password"
type="password"
placeholder="Password"
required>

</div>

<button
id="loginButton"
class="btn btn-green login-btn">

MASUK

</button>

</form>

</div>

</div>


<!-- APP -->

<div id="app" class="app">

<header>

<div class="header">

<div>

<h1>📦 Gudang Karang 0207</h1>

<p>Sistem Inventaris & Peminjaman Barang</p>

</div>

<div class="user">

<div id="userEmail"></div>

<br>

<button
class="btn btn-red"
onclick="logout()">

Keluar

</button>

</div>

</div>

</header>


<div class="container">

<nav>

<button
class="active"
onclick="showPage('dashboard',this)">

🏠 Dashboard

</button>

<button
onclick="showPage('barang',this)">

📦 Barang

</button>

<button
onclick="showPage('lokasi',this)">

📍 Lokasi

</button>

</nav>


<!-- DASHBOARD -->

<section
id="dashboard"
class="page active">

<div class="cards">

<div class="card">

<div class="card-title">
Jenis Barang
</div>

<div
id="totalJenis"
class="card-number">

0

</div>

</div>


<div class="card">

<div class="card-title">
Total Stok
</div>

<div
id="totalStok"
class="card-number">

0

</div>

</div>


<div class="card">

<div class="card-title">
Lokasi
</div>

<div
id="totalLokasi"
class="card-number">

0

</div>

</div>

</div>


<div class="box">

<h2>📦 Daftar Barang</h2>

<div
id="dashboardError"
class="error">
</div>

<div class="table-wrap">

<table>

<thead>

<tr>

<th>Kode</th>
<th>Nama Barang</th>
<th>Stok</th>
<th>Lokasi</th>

</tr>

</thead>

<tbody
id="dashboardBody">

</tbody>

</table>

</div>

</div>

</section>


<!-- BARANG -->

<section
id="barang"
class="page">

<div class="box">

<h2>📦 Data Barang</h2>

<div
id="barangError"
class="error">
</div>

<div class="search">

<input
id="searchBarang"
placeholder="Cari kode atau nama barang..."
oninput="renderBarang()">

</div>

<div class="table-wrap">

<table>

<thead>

<tr>

<th>Kode</th>
<th>Nama Barang</th>
<th>Stok</th>
<th>Lokasi</th>

</tr>

</thead>

<tbody
id="barangBody">

</tbody>

</table>

</div>

</div>

</section>


<!-- LOKASI -->

<section
id="lokasi"
class="page">

<div class="box">

<h2>📍 Lokasi Penyimpanan</h2>

<div
id="lokasiError"
class="error">
</div>

<div class="table-wrap">

<table>

<thead>

<tr>

<th>Nama Lokasi</th>
<th>Keterangan</th>

</tr>

</thead>

<tbody
id="lokasiBody">

</tbody>

</table>

</div>

</div>

</section>

</div>

</div>


<script>

/* =========================
SUPABASE
========================= */

const SUPABASE_URL =
"https://jasvjvvbmicywmamxeln.supabase.co";

const SUPABASE_KEY =
"sb_publishable_-JCTciTci-hqs0PXM72MAQ_bVy7hZJs";

const db =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =========================
DATA
========================= */

let barangData=[];
let lokasiData=[];


/* =========================
LOGIN
========================= */

async function login(event){

event.preventDefault();

const email =
document.getElementById("email").value.trim();

const password =
document.getElementById("password").value;

const error =
document.getElementById("loginError");

const button =
document.getElementById("loginButton");

error.style.display="none";

button.disabled=true;
button.textContent="MEMPROSES...";


const {data,error:loginError} =
await db.auth.signInWithPassword({

email:email,
password:password

});


button.disabled=false;
button.textContent="MASUK";


if(loginError){

error.textContent =
"Login gagal: "+
loginError.message;

error.style.display="block";

return;

}


showApp(data.user);

}


/* =========================
CHECK SESSION
========================= */

async function checkSession(){

const {data} =
await db.auth.getSession();

if(data.session){

showApp(data.session.user);

}else{

showLogin();

}

}


/* =========================
SHOW LOGIN
========================= */

function showLogin(){

document.getElementById("loginPage")
.style.display="flex";

document.getElementById("app")
.style.display="none";

}


/* =========================
SHOW APP
========================= */

async function showApp(user){

document.getElementById("loginPage")
.style.display="none";

document.getElementById("app")
.style.display="block";

document.getElementById("userEmail")
.textContent=user.email || "";

await loadData();

}


/* =========================
LOGOUT
========================= */

async function logout(){

await db.auth.signOut();

showLogin();

}


/* =========================
LOAD DATA
========================= */

async function loadData(){

await loadLokasi();

await loadBarang();

updateDashboard();

}


/* =========================
LOAD LOKASI
========================= */

async function loadLokasi(){

const {data,error} =
await db
.from("lokasi")
.select("id,nama,keterangan")
.order("id");


if(error){

console.error("LOKASI:",error);

showError(
"lokasiError",
error.message
);

return;

}

lokasiData=data || [];

renderLokasi();

}


/* =========================
LOAD BARANG
========================= */

async function loadBarang(){

const {data,error} =
await db
.from("barang")
.select("id,kode,nama,stok,lokasi_id")
.order("id");


if(error){

console.error("BARANG:",error);

showError(
"barangError",
error.message
);

showError(
"dashboardError",
error.message
);

return;

}

barangData=data || [];

renderBarang();

renderDashboard();

}


/* =========================
RENDER BARANG
========================= */

function renderBarang(){

const body =
document.getElementById(
"barangBody"
);

const search =
(
document.getElementById(
"searchBarang"
).value || ""
).toLowerCase();


const data =
barangData.filter(item =>

String(item.kode || "")
.toLowerCase()
.includes(search)

||

String(item.nama || "")
.toLowerCase()
.includes(search)

);


if(data.length===0){

body.innerHTML=`

<tr>

<td
colspan="4"
class="empty">

Belum ada barang

</td>

</tr>

`;

return;

}


body.innerHTML =
data.map(item=>`

<tr>

<td>
<b>
${esc(item.kode)}
</b>
</td>

<td>
${esc(item.nama)}
</td>

<td>

<span class="badge ${
Number(item.stok)<=10
?"red"
:
Number(item.stok)<=50
?"orange"
:"green"
}">

${format(item.stok)}

</span>

</td>

<td>

${getLokasi(item.lokasi_id)}

</td>

</tr>

`).join("");

}


/* =========================
RENDER DASHBOARD
========================= */

function renderDashboard(){

const body =
document.getElementById(
"dashboardBody"
);


if(barangData.length===0){

body.innerHTML=`

<tr>

<td
colspan="4"
class="empty">

Belum ada barang

</td>

</tr>

`;

return;

}


body.innerHTML =
barangData.map(item=>`

<tr>

<td>
${esc(item.kode)}
</td>

<td>
${esc(item.nama)}
</td>

<td>
${format(item.stok)}
</td>

<td>
${getLokasi(item.lokasi_id)}
</td>

</tr>

`).join("");

}


/* =========================
RENDER LOKASI
========================= */

function renderLokasi(){

const body =
document.getElementById(
"lokasiBody"
);


if(lokasiData.length===0){

body.innerHTML=`

<tr>

<td
colspan="2"
class="empty">

Belum ada lokasi

</td>

</tr>

`;

return;

}


body.innerHTML =
lokasiData.map(item=>`

<tr>

<td>
<b>
${esc(item.nama)}
</b>
</td>

<td>
${esc(item.keterangan || "-")}
</td>

</tr>

`).join("");

}


/* =========================
GET LOKASI
========================= */

function getLokasi(id){

const lokasi =
lokasiData.find(
item => String(item.id)===String(id)
);

return lokasi
? esc(lokasi.nama)
: "-";

}


/* =========================
DASHBOARD ANGKA
========================= */

function updateDashboard(){

document.getElementById(
"totalJenis"
).textContent =
format(barangData.length);


const total =
barangData.reduce(
(sum,item)=>
sum+Number(item.stok||0),
0
);


document.getElementById(
"totalStok"
).textContent =
format(total);


document.getElementById(
"totalLokasi"
).textContent =
format(lokasiData.length);

}


/* =========================
NAVIGASI
========================= */

function showPage(page,button){

document
.querySelectorAll(".page")
.forEach(x=>
x.classList.remove("active")
);


document
.getElementById(page)
.classList.add("active");


document
.querySelectorAll("nav button")
.forEach(x=>
x.classList.remove("active")
);


button.classList.add("active");

}


/* =========================
ERROR
========================= */

function showError(id,message){

const box =
document.getElementById(id);

if(!box)return;

box.textContent=
"Database: "+message;

box.style.display="block";

}


/* =========================
FORMAT
========================= */

function format(number){

return Number(number||0)
.toLocaleString("id-ID");

}


function esc(value){

if(value===null||
value===undefined){

return "";

}

return String(value)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =========================
AUTH LISTENER
========================= */

db.auth.onAuthStateChange(
(event,session)=>{

if(session){

showApp(session.user);

}else{

showLogin();

}

});


/* =========================
START
========================= */

checkSession();

</script>

</body>
</html>
